[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itd-scanner"
version = "0.1.0"
description = "A static analysis engine for detecting Idiomatic Technical Debt and vectorized library bypass in Data Science Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Thesis Author", email = "author@kfupm.edu.sa" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0.0",
    "radon>=5.1.0",
]

[project.optional-dependencies]
baselines = [
    "flake8>=6.0.0",
    "pandas-vet>=0.2.3",
    "pylint>=2.15.0",
    "perflint>=0.7.3",
    "dslinter>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
]
all = [
    "itd-scanner[baselines,dev]",
]

[project.scripts]
itd-scanner = "itd_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
